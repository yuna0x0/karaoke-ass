[project]
name = "karaoke-ass"
version = "1.0.2"
description = "Two-row karaoke subtitle template for ASS, with furigana"
readme = "README.md"
license = "MIT"
authors = [{ name = "yuna0x0" }]
requires-python = ">=3.9"
keywords = ["ass", "subtitle", "karaoke", "furigana", "libass"]
classifiers = [
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.scripts]
karaoke-ass = "karaoke_ass.cli:main"

[project.urls]
Repository = "https://github.com/yuna0x0/karaoke-ass"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karaoke_ass"]

[tool.hatch.build.targets.sdist]
include = ["src", "lua", "native", "template", "examples", "docs", "Makefile"]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# printf-style formatting is used deliberately for the aligned report tables
ignore = ["UP031"]
